<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d11">
<title>Hitzstar iPod</title>
<style>
:root{--w:min(94vw,400px,calc((100vh - 28px)/1.7))}
@supports (height:100dvh){:root{--w:min(94vw,400px,calc((100dvh - 28px)/1.7))}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1100px 700px at 50% 28%,#1d2433,#080a0e 72%);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}

/* ───────── iPod body ───────── */
#ipod{--b1:#fbfbfc;--b2:#c7cad2;--edge:#9a9ea8;--w1:#fdfdfe;--w2:#dfe1e7;--wl:#8a8f9a;--c1:#f5f6f8;--c2:#d4d7de;
  position:relative;width:var(--w);height:calc(var(--w)*1.7);border-radius:calc(var(--w)*.095);
  padding:calc(var(--w)*.06) calc(var(--w)*.065) calc(var(--w)*.08);font-size:calc(var(--w)/25);
  background:linear-gradient(155deg,var(--b1),var(--b2));border:1px solid var(--edge);
  box-shadow:0 2.4em 4.5em rgba(0,0,0,.6),inset 0 .15em .35em rgba(255,255,255,.9),inset 0 -.25em .6em rgba(0,0,0,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between}
#ipod[data-body=black]{--b1:#4a4b50;--b2:#0e0e11;--edge:#000;--w1:#2a2a2e;--w2:#141417;--wl:#a2a4ad;--c1:#232327;--c2:#0f0f12}
#ipod[data-body=blue]{--b1:#6aa7ee;--b2:#2a5fae;--edge:#1f4a8a;--w1:#fbfcfe;--w2:#dfe5ee}
#ipod[data-body=red]{--b1:#ee6a5e;--b2:#a3261c;--edge:#7e1a12;--w1:#fdfbfb;--w2:#ecdfde}
#ipod[data-body=green]{--b1:#74c785;--b2:#2f7d3c;--edge:#235e2d;--w1:#fbfdfb;--w2:#dfeadf}
#ipod[data-body=pink]{--b1:#f58db9;--b2:#c24378;--edge:#963159;--w1:#fefbfc;--w2:#efdee5}
#ipod[data-body=gold]{--b1:#f6e4a8;--b2:#c9a24a;--edge:#9a7a2c;--w1:#fffaf0;--w2:#efe3c4}
#ipod[data-body=purple]{--b1:#b894f0;--b2:#6a3cc0;--edge:#4c2a8f;--w1:#fcfbff;--w2:#e5def5}
#ipod[data-body=u2]{--b1:#47474c;--b2:#050506;--edge:#000;--w1:#e0392e;--w2:#8e120c;--wl:#ffe0db;--c1:#1c1c1f;--c2:#000}

#bezel{width:100%;background:#0a0a0c;border-radius:.95em;padding:.55em;box-shadow:inset 0 0 0 .09em #2b2b31,0 .12em .25em rgba(255,255,255,.55)}
#screen{--bg:#fff;--fg:#14171c;--dim:#6b7380;--sep:#e4e8ee;--bar1:#f6f8fb;--bar2:#aab4c2;--barfg:#1b1f27;--hl1:#5ea3f2;--hl2:#1a62c9;--hlfg:#fff;--pv:#eef1f6;
  position:relative;width:100%;aspect-ratio:4/3;border-radius:.5em;overflow:hidden;background:var(--bg);color:var(--fg);
  font-size:calc(var(--w)*.0385*var(--fs,1));display:flex;flex-direction:column;transition:filter .4s}
#screen[data-theme=dark]{--bg:#0d0f13;--fg:#f1f3f7;--dim:#8e95a3;--sep:#1b1f27;--bar1:#444a56;--bar2:#1a1d24;--barfg:#eef0f4;--hl1:#2fe073;--hl2:#12923f;--pv:#14171d}
#screen[data-theme=sunset]{--bg:#1b0f20;--fg:#fff;--dim:#caa9c3;--sep:#2c1830;--bar1:#ff8a5c;--bar2:#c2305e;--barfg:#fff;--hl1:#ffa23c;--hl2:#e8453c;--pv:#26142c}
#screen[data-theme=ocean]{--bg:#071520;--fg:#eaf7ff;--dim:#87aabb;--sep:#0e2635;--bar1:#33b9dc;--bar2:#17607e;--barfg:#fff;--hl1:#22d6cb;--hl2:#0d7f8c;--pv:#0c1f2e}
#screen[data-theme=neon]{--bg:#0a0612;--fg:#f4eaff;--dim:#9a86b8;--sep:#1a1030;--bar1:#ff2bd6;--bar2:#5b17c9;--barfg:#fff;--hl1:#00e5ff;--hl2:#0072ff;--pv:#120a22}
#screen[data-theme=paper]{--bg:#f5edd9;--fg:#3a2e1c;--dim:#8a7a5c;--sep:#e3d7b9;--bar1:#f0e4c5;--bar2:#c9b887;--barfg:#3a2e1c;--hl1:#c98a4d;--hl2:#8a4f1e;--pv:#ebe0c3}
#screen[data-theme=mint]{--bg:#f1fbf6;--fg:#10332a;--dim:#5f8b7d;--sep:#d9efe5;--bar1:#e6f7ef;--bar2:#8fd1b4;--barfg:#10332a;--hl1:#3fcf96;--hl2:#12805a;--pv:#e3f4ec}

#sb{flex:0 0 2em;height:2em;display:flex;align-items:center;justify-content:space-between;padding:0 .6em;position:relative;z-index:6;
  background:linear-gradient(var(--bar1),var(--bar2));color:var(--barfg);font-weight:600;font-size:.95em;border-bottom:1px solid rgba(0,0,0,.28)}
#sb-title{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .3em}
#sb-play{width:1.6em;font-size:.8em}
#sb-batt{position:relative;width:1.9em;height:.85em;border:1px solid currentColor;border-radius:.2em;opacity:.85}
#sb-batt::after{content:"";position:absolute;right:-.28em;top:.22em;width:.2em;height:.32em;background:currentColor;border-radius:0 .1em .1em 0}
#sb-batt i{position:absolute;inset:1px;width:80%;background:currentColor;border-radius:.1em}
#viewport{flex:1;position:relative;min-height:0}

/* lists */
.split{position:absolute;inset:0;display:flex}
.lwrap{position:relative;flex:1;overflow:hidden;min-width:0}
.has-pv .lwrap{flex:0 0 58%}
.list{position:absolute;inset:0;overflow:hidden}
.row{display:flex;align-items:center;gap:.4em;padding:0 .7em;height:2em;border-bottom:1px solid var(--sep);color:var(--fg);cursor:pointer}
.two .row{height:3em}
.row.sel{background:linear-gradient(var(--hl1),var(--hl2));color:var(--hlfg);border-bottom-color:transparent}
.rl{flex:1;min-width:0}
.rt,.rs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:.8em;color:var(--dim);margin-top:.05em}
.row.sel .rs,.row.sel .rv{color:var(--hlfg);opacity:.9}
.rv{color:var(--dim);font-size:.9em;white-space:nowrap}
.rc{font-size:1.25em;opacity:.7;line-height:1}
.sbar{position:absolute;right:.15em;top:.25em;bottom:.25em;width:.3em;border-radius:.2em;background:rgba(128,128,128,.16);display:none}
.sbar i{position:absolute;left:0;right:0;border-radius:.2em;background:rgba(128,128,128,.75)}
.pv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45em;padding:.6em;background:var(--pv);min-width:0}
.pv-img{width:100%;aspect-ratio:1;border-radius:.45em;background-size:cover;background-position:center;box-shadow:0 .3em 1em rgba(0,0,0,.4);position:relative;overflow:hidden}
.pv-img.empty{background-image:linear-gradient(135deg,#1db954,#0a3d1d)}
.pv-img.empty::after{content:"★";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4em;color:rgba(255,255,255,.85)}
.pv-cap{font-size:.74em;color:var(--dim);text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* now playing */
.np{position:absolute;inset:0;color:#fff;overflow:hidden;background:#111}
.np-bg{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(16px) brightness(.55) saturate(1.5);transition:background-image .4s}
.np-in{position:relative;height:100%;padding:.75em .85em .6em;display:flex;flex-direction:column;justify-content:space-between}
.np-top{display:flex;gap:.85em;align-items:flex-start}
.np-art{flex:0 0 38%;aspect-ratio:1;border-radius:.4em;background:#222 center/cover;box-shadow:0 .4em 1.1em rgba(0,0,0,.55)}
.np-meta{flex:1;min-width:0}
.np-t{font-weight:700;font-size:1.05em;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.np-a,.np-al{font-size:.85em;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15em}
.np-ic{font-size:.78em;opacity:.85;margin-top:.45em}
.np-bar{position:relative;height:.55em;border-radius:.3em;background:rgba(255,255,255,.25);overflow:visible}
.np-fill{height:100%;width:0;border-radius:.3em;background:linear-gradient(#fff,var(--acc,#86bdff))}
.np-times{display:flex;justify-content:space-between;font-size:.8em;opacity:.9;margin-top:.25em}

/* cover flow */
.cf{position:absolute;inset:0;background:linear-gradient(#000,#1c1c1f);overflow:hidden}
.cf-stage{position:absolute;left:0;right:0;top:0;height:74%;perspective:34em}
.cf-item{position:absolute;left:50%;top:10%;width:40%;aspect-ratio:1;background:#2a2d35 center/cover;border-radius:.15em;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .3s;-webkit-box-reflect:below .1em linear-gradient(transparent 58%,rgba(255,255,255,.3))}
.cf-cap{position:absolute;left:0;right:0;bottom:.5em;text-align:center;color:#fff;padding:0 .6em}
.cf-t{font-weight:700;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf-a{font-size:.8em;color:#aab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* misc screens */
.txt{position:absolute;inset:0;overflow:hidden;padding:.7em .85em;white-space:pre-wrap;line-height:1.45;font-size:.92em}
.ld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;color:var(--dim)}
.spin{width:2em;height:2em;border-radius:50%;border:.22em solid rgba(128,128,128,.3);border-top-color:var(--hl2);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sr{position:absolute;inset:0;padding:1em;display:flex;flex-direction:column;gap:.6em;justify-content:center}
.sr-l{font-weight:700;font-size:1.1em}
.sr input{width:100%;font:inherit;padding:.55em .7em;border-radius:.45em;border:1px solid var(--sep);background:rgba(128,128,128,.14);color:var(--fg);outline:none;user-select:text;-webkit-user-select:text}
.sr input:focus{border-color:var(--hl1)}
.sr-h{font-size:.78em;color:var(--dim)}
#ov{position:absolute;left:9%;right:9%;bottom:.8em;display:none;z-index:8;background:rgba(0,0,0,.72);color:#fff;border-radius:.6em;padding:.45em .7em;font-size:.85em}
.ov-b{height:.5em;border-radius:.3em;background:rgba(255,255,255,.28);overflow:hidden;margin-top:.3em}
.ov-b i{display:block;height:100%;background:linear-gradient(#fff,#9cc9ff)}
#stoast{position:absolute;left:50%;top:2.6em;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:.35em .85em;border-radius:1em;font-size:.8em;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:9}
#stoast.on{opacity:1}
#splash{position:absolute;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;transition:opacity .5s}
.sp-logo{font-size:2.1em;font-weight:800;letter-spacing:.02em;background:linear-gradient(90deg,#1ed760,#7be8a5);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-sub{color:#999;letter-spacing:.3em;font-size:.8em}

/* ───────── click wheel ───────── */
#wheel{position:relative;width:calc(var(--w)*.68);aspect-ratio:1;border-radius:50%;touch-action:none;cursor:pointer;
  background:radial-gradient(circle at 50% 35%,var(--w1),var(--w2));
  box-shadow:inset 0 .12em .3em rgba(255,255,255,.7),inset 0 -.2em .5em rgba(0,0,0,.14),0 .2em .6em rgba(0,0,0,.25)}
.wl{position:absolute;color:var(--wl);font-weight:700;font-size:.82em;letter-spacing:.04em;pointer-events:none}
.wl-menu{top:9%;left:50%;transform:translateX(-50%)}
.wl-play{bottom:8%;left:50%;transform:translateX(-50%);font-size:.95em}
.wl-next{right:10%;top:50%;transform:translateY(-50%);font-size:.95em}
.wl-prev{left:10%;top:50%;transform:translateY(-50%);font-size:.95em}
#center{position:absolute;inset:31%;border-radius:50%;background:radial-gradient(circle at 50% 30%,var(--c1),var(--c2));box-shadow:0 .08em .25em rgba(0,0,0,.3),inset 0 .1em .2em rgba(255,255,255,.7);transition:transform .08s;touch-action:none}
#center.down{transform:scale(.96);filter:brightness(.93)}

/* ───────── v2 polish ───────── */
#ipod::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 36%,rgba(0,0,0,0) 72%,rgba(0,0,0,.07) 100%)}
#ipod[data-body=black]::before,#ipod[data-body=u2]::before{opacity:.28}
#hold{position:absolute;z-index:3;top:calc(var(--w)*.017);right:calc(var(--w)*.13);width:calc(var(--w)*.19);height:calc(var(--w)*.03);border-radius:99px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 3px rgba(0,0,0,.55);cursor:pointer}
#hold i{position:absolute;top:10%;bottom:10%;left:5%;width:44%;border-radius:99px;background:linear-gradient(#f6f6f8,#b6b9c2);box-shadow:0 1px 2px rgba(0,0,0,.45);transition:left .16s,background .16s}
#hold.on i{left:51%;background:linear-gradient(#ff9d8d,#d6402b)}
#screen::after{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 40%)}
#screen.dim{filter:brightness(.16)!important}
#screen.off{filter:brightness(0)!important}
#screen.off *{pointer-events:none}
#wdot{position:absolute;width:1.1em;height:1.1em;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.22),rgba(0,0,0,0) 70%);transform:translate(-50%,-50%);opacity:0;transition:opacity .15s;pointer-events:none}
#wheel.touch #wdot{opacity:1}
#wheel.touch{box-shadow:inset 0 .12em .3em rgba(255,255,255,.7),inset 0 -.2em .5em rgba(0,0,0,.2),0 .2em .9em rgba(0,0,0,.3)}
@keyframes slR{from{transform:translateX(34%);opacity:.2}to{transform:none;opacity:1}}
@keyframes slL{from{transform:translateX(-34%);opacity:.2}to{transform:none;opacity:1}}
#viewport.slR>*{animation:slR .22s cubic-bezier(.2,.8,.2,1)}
#viewport.slL>*{animation:slL .22s cubic-bezier(.2,.8,.2,1)}
.rt span{display:inline-block;white-space:nowrap}
.rt.marq{text-overflow:clip}
.rt.marq span{animation:mq var(--mqd,4s) linear .7s infinite alternate}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(var(--mqx,0))}}
@keyframes gshift{0%,100%{background-position:0 0}50%{background-position:100% 100%}}
.pv-img.empty{background-size:240% 240%;animation:gshift 7s ease-in-out infinite}
.np-bg{animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translate(-2%,-1.5%)}}
.np-glow{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
.np-bot{position:relative}
.np-st{font-size:.95em;color:#ffd75e;letter-spacing:.08em;margin-top:.3em;white-space:nowrap}
.np-head{position:absolute;top:50%;left:0;width:.95em;height:.95em;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 .5em rgba(0,0,0,.55)}
.np-next{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .6em;opacity:.7;font-size:.9em}
.np-eq{position:absolute;right:.05em;top:-2em;display:flex;align-items:flex-end;gap:.15em;height:1.5em}
.np-eq i{display:block;width:.28em;height:22%;border-radius:.1em;background:var(--acc,#8cc1ff);opacity:.92}
.np.playing .np-eq i{animation:eq 1s ease-in-out infinite}
.np-eq i:nth-child(1){animation-duration:.9s}.np-eq i:nth-child(2){animation-duration:1.1s;animation-delay:-.3s}
.np-eq i:nth-child(3){animation-duration:.8s;animation-delay:-.5s}.np-eq i:nth-child(4){animation-duration:1.3s;animation-delay:-.1s}
.np-eq i:nth-child(5){animation-duration:1s;animation-delay:-.7s}.np-eq i:nth-child(6){animation-duration:.7s;animation-delay:-.2s}
.np-eq i:nth-child(7){animation-duration:1.2s;animation-delay:-.6s}
@keyframes eq{0%,100%{height:18%}50%{height:100%}}
.sp-bar{width:42%;height:.35em;border-radius:.3em;background:#2a2a2e;margin-top:.9em;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:#1ed760;animation:spb 1s linear forwards}
@keyframes spb{to{width:100%}}
#sb-r{display:flex;align-items:center;gap:.45em;font-size:.82em}
#sb-ic{white-space:nowrap}
#sb-clk{font-weight:600;white-space:nowrap}
.clk{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;padding:.6em}
.clk-f{height:90%;aspect-ratio:1}
.clk-c{fill:var(--bg);stroke:var(--fg);stroke-width:2}
.clk-t{stroke:var(--fg);stroke-width:2;opacity:.8}
.clk-h,.clk-m{stroke:var(--fg);stroke-linecap:round}.clk-h{stroke-width:4}.clk-m{stroke-width:2.6}
.clk-s{stroke:#ff3b30;stroke-width:1.2}.clk-dot{fill:#ff3b30}
.clk-d{text-align:center}#ck-t{font-size:1.45em;font-weight:700}#ck-dt{font-size:.8em;color:var(--dim);margin-top:.3em}
.sw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em}
.sw-t{font-size:2.3em;font-weight:700;font-variant-numeric:tabular-nums}
.sw-h{font-size:.72em;color:var(--dim)}
.sw-l{font-size:.85em;font-variant-numeric:tabular-nums;min-height:4.6em;text-align:center}
.cal{position:absolute;inset:0;padding:.5em .7em}
.cal-t{font-weight:700;text-align:center;margin-bottom:.35em}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:.15em;text-align:center;font-size:.85em}
.cal-h{color:var(--dim);font-weight:700}.cal-d{padding:.18em 0;border-radius:.3em}
.cal-d.today{background:linear-gradient(var(--hl1),var(--hl2));color:var(--hlfg);font-weight:700}
.spl{position:absolute;inset:0;padding:.8em;display:flex;flex-direction:column;justify-content:center;gap:.9em;align-items:center}
.spl-t{min-height:1.6em;font-size:1.2em;font-weight:700;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.caret{display:inline-block;width:.1em;height:1em;background:var(--hl1);margin-left:.1em;vertical-align:-.12em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.spl-row{display:flex;gap:.45em;align-items:center;justify-content:center}
.spl-c{font-size:1.15em;min-width:1.1em;text-align:center}
.spl-c.cur{font-size:1.9em;font-weight:800;color:var(--hlfg);background:linear-gradient(var(--hl1),var(--hl2));border-radius:.35em;padding:.05em .3em}
.spl-h{font-size:.72em;color:var(--dim);text-align:center}
#yt-shell{position:fixed;top:-3000px;left:-3000px;width:320px;height:180px;opacity:0;pointer-events:none;overflow:hidden;z-index:1}
#yt-shell iframe{width:100%;height:100%;border:0;display:block}
#hint{position:fixed;right:22px;bottom:18px;max-width:250px;color:#7e8798;font-size:12px;line-height:1.55}
#hint b{color:#aab3c4}
@media (max-width:820px){#hint{display:none}}
</style>
</head>
<body>
<div id="ipod" data-body="silver">
  <div id="hold" title="Hold switch"><i></i></div>
  <div id="bezel">
    <div id="screen" data-theme="classic">
      <div id="sb"><span id="sb-play"></span><span id="sb-title">Hitzstar</span><span id="sb-r"><span id="sb-ic"></span><span id="sb-clk"></span><span id="sb-batt"><i></i></span></span></div>
      <div id="viewport"></div>
      <div id="ov"></div>
      <div id="stoast"></div>
      <div id="splash"><div class="sp-logo">★ Hitzstar</div><div class="sp-sub">iPod</div></div>
    </div>
  </div>
  <div id="wheel">
    <div class="wl wl-menu">MENU</div><div class="wl wl-next">⏭</div><div class="wl wl-prev">⏮</div><div class="wl wl-play">⏯</div>
    <div id="wdot"></div><div id="center"></div>
  </div>
</div>
<div id="yt-shell"></div>
<div id="hint"><b>Wheel:</b> drag around it or scroll with your mouse<br><b>Center:</b> select · hold for options<br><b>Edges:</b> menu · next/prev (hold to seek) · play/pause<br><b>Hold ⏯:</b> power off · <b>H</b> or the top switch: lock<br><b>Keys:</b> ↑↓ scroll, Enter select, Esc back, Space play, C options</div>

<script>

let AC=null;
function tick(){

    AC=AC||new (window.AudioContext||window.webkitAudioContext)();

function ytPick(items,t){
  if(!items||!items.length) return null;
  const words=t.title.toLowerCase().replace(/[^\w\s]/g,' ').split(/\s+/).filter(w=>w.length>2);
  const feats=(t.features||[]).map(f=>f.name.toLowerCase());
  const sc=items.map(it=>{
    const x=((it.snippet&&it.snippet.title)||'').toLowerCase(); let s=0;
    words.forEach(w=>{if(x.includes(w))s+=2}); if(x.includes(t.artist.toLowerCase()))s+=2;
    feats.forEach(n=>{if(x.includes(n))s+=1}); if(x.includes('official'))s+=1;
    if(/\b(cover|karaoke|instrumental|reaction|tribute|8d audio|slowed|sped up|nightcore)\b/.test(x))s-=6;
    return {it,s};
  }).sort((a,b)=>b.s-a.s);

async function playTrack(i){

function buildPlayer(id){

  const pv={autoplay:1,mute:1,controls:0,disablekb:1,rel:0,playsinline:1,modestbranding:1,iv_load_policy:3};

    onReady:e=>{ytReady=true;e.target.mute();e.target.playVideo();e.target.setVolume(vol);e.target.unMute();applySpeed();armUnmute()},
    onStateChange:e=>{

(function wheel(){
  const w=$('#wheel'), dot=$('#wdot'); let tr=null, holdT=null, holdIv=null, holdOn=false, pwrT=null, pwrDone=false;
  const endHold=()=>{clearTimeout(holdT);clearInterval(holdIv);const was=holdOn;holdOn=false;return was};
  const region=a=>{const d=(a*180/Math.PI+360)%360;return (d>=315||d<45)?'next':d<135?'play':d<225?'prev':'menu'};
  const moveDot=e=>{const r=w.getBoundingClientRect();dot.style.left=(e.clientX-r.left)+'px';dot.style.top=(e.clientY-r.top)+'px'};
  w.addEventListener('pointerdown',e=>{
    if(locked){flashHold();return}
    const r=w.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, dx=e.clientX-cx, dy=e.clientY-cy;
    if(Math.hypot(dx,dy)<r.width/2*.38) return; // the center button handles its own presses
    try{w.setPointerCapture(e.pointerId)}catch{}
    const a=Math.atan2(dy,dx); tr={cx,cy,last:a,acc:0,moved:0,start:a,reg:region(a)};
    w.classList.add('touch'); moveDot(e);
    if(tr.reg==='next'||tr.reg==='prev'){const dir=tr.reg==='next'?1:-1;holdT=setTimeout(()=>{holdOn=true;holdIv=setInterval(()=>seekBy(dir*6),200)},450)}
    if(tr.reg==='play'){pwrDone=false;pwrT=setTimeout(()=>{pwrDone=true;powerOff()},1400)}
  });
  w.addEventListener('pointermove',e=>{
    if(!tr) return; moveDot(e);
    const a=Math.atan2(e.clientY-tr.cy,e.clientX-tr.cx); let d=a-tr.last;
    if(d>Math.PI)d-=2*Math.PI; if(d<-Math.PI)d+=2*Math.PI;
    tr.last=a; tr.acc+=d; tr.moved+=Math.abs(d);
    if(tr.moved>.2){endHold();clearTimeout(pwrT)}
    const STEP=Math.PI/SENS[prefs.sens];
    while(tr.acc>STEP){tr.acc-=STEP;wheelStep(1)}
    while(tr.acc<-STEP){tr.acc+=STEP;wheelStep(-1)}
  });
  const up=()=>{
    if(!tr) return; const t=tr; tr=null; w.classList.remove('touch'); clearTimeout(pwrT); const was=endHold();
    if(pwrDone){pwrDone=false;return}
    if(t.moved<.2&&!was){ if(t.reg==='next')btnNext(); else if(t.reg==='prev')btnPrev(); else if(t.reg==='play')btnPlay(); else btnMenu(); }
  };
  w.addEventListener('pointerup',up); w.addEventListener('pointercancel',()=>{tr=null;w.classList.remove('touch');clearTimeout(pwrT);endHold()});
  // center button: click = select, hold = options
  const c=$('#center'); let ct=null, long=false;
  c.addEventListener('pointerdown',e=>{e.preventDefault();if(locked){flashHold();return}long=false;c.classList.add('down');ct=setTimeout(()=>{long=true;tick();ctxMenu()},550)});
  const cu=()=>{clearTimeout(ct);c.classList.remove('down');if(!long&&!locked)selectItem();long=false};
  c.addEventListener('pointerup',cu);
  c.addEventListener('pointerleave',()=>{clearTimeout(ct);c.classList.remove('down')});
  c.addEventListener('pointercancel',()=>{clearTimeout(ct);c.classList.remove('down')});
  // mouse wheel / trackpad scrolling
  let acc=0;
  $('#ipod').addEventListener('wheel',e=>{e.preventDefault();if(locked)return;acc+=e.deltaY;if(Math.abs(acc)>36){wheelStep(acc>0?1:-1);acc=0}},{passive:false});
})();

function submitSearch(){const s=scr();if(!s||s.type!=='search')return;const q=($('#q')&&$('#q').value||s.q||'').trim();if(!q){toast('Type something to search');return}try{document.activeElement.blur()}catch{}doSearch(q)}
async function doSearch(q){
  saveSearch(q);
  const ph={type:'loading',title:'Searching',msg:'"'+q+'"'}; push(ph);
  let res;
  try{
    const [a,r,al]=await Promise.all([
      mb('artist/?query='+enc(q)+'&limit=8&fmt=json').catch(()=>({artists:[]})),
      mb('recording/?query='+enc(lucene('recording',q))+'&limit=100&fmt=json').catch(()=>({recordings:[]})),
      mb('release-group/?query='+enc(lucene('releasegroup',q))+'&limit=10&fmt=json').catch(()=>({'release-groups':[]}))]);
    const artists=a.artists||[]; let songs=rankRec((r.recordings||[]).filter(x=>x.title)); let albums=(al['release-groups']||[]).filter(x=>x.title);
    if(artists.length){
      await sleep(150);
      const top=artists[0];
      const [ao,so]=await Promise.all([
        mb('release-group/?artist='+top.id+'&limit=15&fmt=json').catch(()=>({'release-groups':[]})),
        mb('recording/?query='+enc('arid:"'+top.id+'"')+'&limit=40&fmt=json').catch(()=>({recordings:[]}))]);
      const ids=new Set(albums.map(x=>x.id)); albums=[...(ao['release-groups']||[]).filter(x=>x.title&&!ids.has(x.id)),...albums];
      const ts=new Set(songs.map(x=>x.title.toLowerCase())); songs=[...rankRec((so.recordings||[]).filter(x=>x.title)).filter(x=>!ts.has(x.title.toLowerCase())),...songs];
    }
    const tracks=songs.slice(0,30).map(trackFromRec);
    const items=[
      {label:'Artists',sub:artists.length+' found',chev:1,onSelect:()=>push(artistsList(artists,'Artists'))},
      {label:'Songs',sub:tracks.length+' found',chev:1,onSelect:()=>push(tracksScreen('Songs',tracks))},
      {label:'Albums',sub:Math.min(albums.length,40)+' found',chev:1,onSelect:()=>push(albumsFromGroups(albums.slice(0,40)))}
    ];
    if(artists.length){const t=artists[0];items.push({label:'This Is '+t.name,sub:'Hitzstar Mix',art:()=>artistPhoto(t),chev:1,onSelect:()=>openMix('This Is '+t.name,()=>artistMix(t,'top'))})}
    res=listScreen('Results',items,{rowH:'two'});
    if(!artists.length&&!tracks.length&&!albums.length) res=textScreen('Results','No results for "'+q+'".\n\nTry a different spelling.');
  }catch(e){console.warn(e);res=textScreen('Results','Search failed. Check your connection and try again.')}
  const i=stack.indexOf(ph); if(i<0) return; stack[i]=res; res.sel=0; if(scr()===res) render();
}

function cleanDiscogs(t){return (t||'').replace(/\[a=([^\]]+)\]/g,'$1').replace(/\[a\d+\]|\[[lmr]\d+\]/g,'').replace(/\[url=[^\]]*\]([^\[]*)\[\/url\]/g,'$1').replace(/\[\/?[a-z]\]/gi,'').trim()}
async function artistBio(a){
  const full=await mb('artist/'+a.id+'?inc=annotation+url-rels&fmt=json');
  if(full.annotation) return full.annotation;
  let did=discogsIdFromRels(full.relations); if(!did) did=await discogsByName(a.name);
  if(did){const dg=await discogsArtist(did);if(dg.profile) return cleanDiscogs(dg.profile)+'\n\n— Source: Discogs'}
  return '';
}
const ED_RE=/\bedition\b|\bremaster(ed)?\b|\bbonus track\b|\bdeluxe\b|\breloaded\b/i;
const discoMem=new Map();
function discography(a){
  if(!discoMem.has(a.id)) discoMem.set(a.id,(async()=>{
    const run=async f=>{try{return await f()}catch{return null}};
    const eq='arid:"'+a.id+'" AND (edition OR deluxe OR remaster OR reloaded OR "bonus track")';
    const rgData=await mb('release-group/?artist='+a.id+'&limit=80&fmt=json');
    const [edG,edR,...pages]=await Promise.all([
      run(()=>mb('release-group/?query='+enc(eq)+'&limit=40&fmt=json')),
      run(()=>mb('release/?query='+enc(eq)+'&limit=40&fmt=json')),
      ...[0,1,2].map(p=>sleep(p*140).then(()=>run(()=>mb('release/?artist='+a.id+'&limit=100&offset='+(p*100)+'&inc=release-groups&fmt=json'))))]);
    const groups=rgData['release-groups']||[], albums=[], eds=[];
    groups.forEach(g=>(ED_RE.test(g.title)||ED_RE.test(g.disambiguation||''))?eds.push(g):albums.push(g));
    const known=new Set(groups.map(g=>g.id));
    ((edG&&edG['release-groups'])||[]).forEach(g=>{if(!known.has(g.id)){known.add(g.id);eds.push(g)}});
    const seen=new Set(eds.map(e=>e.id+'::'+e.title.toLowerCase())), seenRel=new Set();
    const rels=[...((edR&&edR.releases)||[]),...pages.flatMap(p=>(p&&p.releases)||[])];
    rels.forEach(r=>{
      if(seenRel.has(r.id))return; seenRel.add(r.id);
      const rg=r['release-group']; if(!rg)return;
      const dis=r.disambiguation||'', tm=ED_RE.test(r.title), dm=ED_RE.test(dis); if(!tm&&!dm)return;
      const same=r.title.toLowerCase()===rg.title.toLowerCase(); if(same&&!dm)return;
      const disp=(same&&dm)?r.title+' ('+dis+')':r.title, key=rg.id+'::'+disp.toLowerCase(); if(seen.has(key))return; seen.add(key);
      eds.push({id:rg.id,title:disp,'primary-type':rg['primary-type'],'first-release-date':r.date||rg['first-release-date'],_releaseId:r.id});
    });
    const byDate=(x,y)=>(y['first-release-date']||'').localeCompare(x['first-release-date']||'');
    return {albums:albums.sort(byDate),editions:eds.sort(byDate)};
  })().catch(e=>{discoMem.delete(a.id);throw e}));
  return discoMem.get(a.id);
}
function albumsScreen(a,list,title,isEd){
  if(!list.length) return textScreen(title,'Nothing found.');
  return listScreen(title,list.map(g=>({label:g.title,sub:(g['primary-type']||'Album')+(g['first-release-date']?' · '+g['first-release-date'].slice(0,4):''),
    art:()=>albumArt(g.id,a.id,g._releaseId||null,!!g._releaseId),chev:1,onSelect:()=>openAlbum(a,g,g._releaseId||null)})),{preview:true,rowH:'two'});
}
function openAlbum(artist,rg,releaseId){
  openAsync(rg.title||'Album',async()=>{
    const [art,rel]=await Promise.all([
      albumArt(rg.id,artist.id,releaseId||null,!!releaseId).catch(()=>null),
      releaseId?Promise.resolve({releases:[{id:releaseId}]}):mb('release/?release-group='+rg.id+'&limit=1&fmt=json')]);
    if(!rel.releases||!rel.releases.length) return textScreen(rg.title,'No release data found.');
    const full=await mb('release/'+rel.releases[0].id+'?inc=recordings+artist-credits&fmt=json');
    const tracks=[];
    (full.media||[]).forEach(m=>(m.tracks||[]).forEach(tk=>{
      const rec=tk.recording||{}, cr=creditsOf(rec['artist-credit'],artist.id,artist.name), len=tk.length||rec.length;
      tracks.push({title:tk.title||rec.title,duration:len?len/1000:0,album:rg.title,albumId:rg.id,albumType:rg['primary-type']||'Album',artist:cr.artist,artistId:cr.artistId,albumArt:art,features:cr.features,youtubeId:null});
    }));
    if(!tracks.length) return textScreen(rg.title,'No tracks listed for this release.');
    return tracksScreen(rg.title,tracks,{artUrl:art});
  },'Loading album…');
}

/* ═════════ generated mixes ═════════ */
async function albumTracks(artist,rgId,title,type,max,skip){
  try{
    const rel=await mb('release/?release-group='+rgId+'&limit=1&fmt=json'); if(!rel.releases||!rel.releases.length) return [];
    const full=await mb('release/'+rel.releases[0].id+'?inc=recordings+artist-credits&fmt=json');
    const out=[]; let seen=0;
    (full.media||[]).forEach(m=>(m.tracks||[]).forEach(tk=>{
      if(out.length>=max) return; seen++; if(seen<=skip) return;
      const rec=tk.recording||{}, cr=creditsOf(rec['artist-credit'],artist.id,artist.name), len=tk.length||rec.length;
      out.push({title:tk.title||rec.title,duration:len?len/1000:0,album:title,albumId:rgId,albumType:type,artist:cr.artist,artistId:cr.artistId,albumArt:'https://coverartarchive.org/release-group/'+rgId+'/front',features:cr.features,youtubeId:null});
    }));
    return out;
  }catch{return []}
}
async function artistMix(artist,variant){
  const rel=await mb('release-group/?artist='+artist.id+'&limit=50&fmt=json').catch(()=>({'release-groups':[]}));
  const groups=(rel['release-groups']||[]).filter(g=>['Album','EP','Single'].includes(g['primary-type']));
  if(!groups.length) return [];
  const sample=groups.length<=10?groups:groups.filter((_,i)=>i%Math.ceil(groups.length/10)===0).slice(0,10);
  const deep=variant==='deep';
  const ordered=deep?[...sample].sort((a,b)=>(a['primary-type']==='Album'?1:0)-(b['primary-type']==='Album'?1:0)):sample;
  const picked=[], seen=new Set();
  for(const g of ordered){
    const tr=await albumTracks(artist,g.id,g.title,g['primary-type']||'Album',4,deep?4:0);
    tr.forEach(t=>{const k=t.title.toLowerCase().trim();if(!seen.has(k)){seen.add(k);picked.push(t)}});
    await sleep(120); if(picked.length>=20) break;
  }
  return picked;
}
async function tagMix(g){
  const q=g.from?'date:['+g.from+' TO '+g.to+']':'tag:"'+g.key+'"';
  const d=await mb('recording/?query='+enc(q)+'&limit=80&fmt=json').catch(()=>({recordings:[]}));
  const seen=new Set(), out=[];
  for(const r of rankRec((d.recordings||[]).filter(x=>x.title))){const k=r.title.toLowerCase().trim();if(seen.has(k))continue;seen.add(k);out.push(r);if(out.length>=20)break}
  return out.map(trackFromRec);
}
async function top10(){
  const all=[];
  for(const tag of ['pop','hip hop','r&b','rock','electronic']){
    const d=await mb('recording/?query='+enc('tag:"'+tag+'"')+'&limit=40&fmt=json').catch(()=>({recordings:[]}));
    all.push(...(d.recordings||[]).filter(r=>r.title)); await sleep(150);
  }
  const seen=new Set(), out=[];
  for(const r of rankRec(all)){const k=r.title.toLowerCase().trim();if(seen.has(k))continue;seen.add(k);out.push(r);if(out.length>=10)break}
  return out.map(trackFromRec);
}

/* ═════════ v2: state, power, hold, wake ═════════ */
let locked=false, off=false, asleep=false, idleT=null, quizMode=false, lastFlash=0;
function setLock(b){locked=b;$('#hold').classList.toggle('on',b);updateSb();toast(b?'🔒 Hold on':'Hold off')}
function flashHold(){const n=Date.now();if(n-lastFlash>500){lastFlash=n;toast('🔒 Hold is on — slide the switch')}}
function updateSb(){
  $('#sb-play').textContent=playing?'▶':(nowT?'⏸':'');
  $('#sb-ic').textContent=[locked?'🔒':'',shuffleOn?'🔀':'',['','🔁','🔂'][repeatMode]].filter(Boolean).join(' ');
  const c=$('#sb-clk'); if(prefs.clock){c.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}else c.textContent='';
}
function resetIdle(){
  clearTimeout(idleT); const s=BL[prefs.backlight];
  if(s>0) idleT=setTimeout(()=>{const t=scr();if(off||(t&&t.type==='video'))return;asleep=true;$('#screen').classList.add('dim')},s*1000);
}
function bump(){
  if(off){powerOn();return true}
  if(asleep){asleep=false;$('#screen').classList.remove('dim')}
  resetIdle(); return false;
}
function powerOff(){if(off)return;try{if(ytPlayer)ytPlayer.pauseVideo()}catch{}off=true;clearTimeout(idleT);$('#screen').classList.add('off')}
function powerOn(){off=false;asleep=false;$('#screen').classList.remove('off','dim');showSplash();chime();resetIdle()}
function chime(){
  if(!prefs.startup) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    [[523.25,0],[783.99,.16],[1046.5,.32]].forEach(([f,t0])=>{
      const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+t0;
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.07,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+.5);
      o.start(t); o.stop(t+.55);
    });
  }catch{}
}
function showSplash(){
  const old=$('#splash'); if(old) old.remove();
  const sp=document.createElement('div'); sp.id='splash';
  sp.innerHTML='<div class="sp-logo">★ Hitzstar</div><div class="sp-sub">iPod</div><div class="sp-bar"><i></i></div>';
  $('#screen').appendChild(sp);
  setTimeout(()=>{sp.style.opacity='0';setTimeout(()=>sp.remove(),520)},1100);
}

/* ═════════ v2: Up Next, search menu, spell-to-search ═════════ */
function queueScreen(){
  return listScreen('Up Next',()=>queue.map((t,i)=>({label:t.title,sub:artistLine(t),track:t,value:()=>i===qi?'♪':'',art:()=>trackArt(t),onSelect:()=>{playTrack(i);back();gotoNow()}})),
    {preview:true,rowH:'two',empty:'Queue is empty',sel:Math.max(0,qi)});

function saveSearch(q){const r=jget('ipod_searches',[]).filter(x=>x.toLowerCase()!==q.toLowerCase());r.unshift(q);jset('ipod_searches',r.slice(0,8))}
function searchMenu(){

    const rec=jget('ipod_searches',[]);
    return [
      {label:'Type with Keyboard',sub:'Use your keyboard',chev:1,onSelect:()=>push({type:'search',title:'Search'})},
      {label:'Spell with Wheel',sub:'iPod-style text entry',chev:1,onSelect:()=>push(spellScreen())},

      rec.length&&{label:'Clear Recent Searches',onSelect:()=>{jset('ipod_searches',[]);render()}}
    ];
  },{rowH:'two'});
}
const CHARS=[...'abcdefghijklmnopqrstuvwxyz0123456789',' ','⌫','✓'];
function spellScreen(){return {type:'spell',title:'Spell to Search',text:'',ci:0}}
function renderSpell(s,vp){
  const n=CHARS.length; let row='';
  for(let o=-4;o<=4;o++){const ch=CHARS[(s.ci+o+n*2)%n];row+='<span class="spl-c'+(o===0?' cur':'')+'" style="opacity:'+(1-Math.abs(o)*.17)+'">'+esc(ch===' '?'␣':ch)+'</span>'}
  vp.innerHTML='<div class="spl"><div class="spl-t">'+esc(s.text||'')+'<b class="caret"></b></div><div class="spl-row">'+row+'</div><div class="spl-h">Turn the wheel · click to add · ⌫ deletes · ✓ searches</div></div>';
}
function spellSelect(s){
  const ch=CHARS[s.ci]; tick();
  if(ch==='⌫') s.text=s.text.slice(0,-1);
  else if(ch==='✓'){if(!s.text.trim()){toast('Spell something first');return}doSearch(s.text.trim());return}
  else s.text+=ch;
  renderSpell(s,$('#viewport'));
}

/* ═════════ v2: Extras (clock, stopwatch, calendar, brick, quiz) ═════════ */
function extrasMenu(){
  return listScreen('Extras',[
    {label:'Clock',chev:1,onSelect:()=>push({type:'clock',title:'Clock'})},
    {label:'Stopwatch',chev:1,onSelect:()=>{const s={type:'stopwatch',title:'Stopwatch',t:0,run:false,t0:0,laps:[]};s.onLong=()=>swReset(s);push(s)}},
    {label:'Calendar',chev:1,onSelect:()=>push({type:'calendar',title:'Calendar',m:0})},
    {label:'Brick',chev:1,onSelect:()=>push({type:'brick',title:'Brick'})},
    {label:'Music Quiz',chev:1,onSelect:startQuiz}
  ]);
}
function renderClock(s,vp){
  vp.innerHTML='<div class="clk"><svg viewBox="0 0 100 100" class="clk-f"><circle cx="50" cy="50" r="46" class="clk-c"/>'+
    [...Array(12)].map((_,i)=>'<line x1="50" y1="8" x2="50" y2="'+(i%3===0?16:12)+'" transform="rotate('+(i*30)+' 50 50)" class="clk-t"/>').join('')+
    '<line id="ck-h" x1="50" y1="50" x2="50" y2="28" class="clk-h"/><line id="ck-m" x1="50" y1="50" x2="50" y2="16" class="clk-m"/><line id="ck-s" x1="50" y1="55" x2="50" y2="13" class="clk-s"/><circle cx="50" cy="50" r="2.6" class="clk-dot"/></svg>'+
    '<div class="clk-d"><div id="ck-t"></div><div id="ck-dt"></div></div></div>';
  const upd=()=>{
    if(scr()!==s){clearInterval(s._iv);return}
    const h=$('#ck-h'); if(!h) return;
    const d=new Date(), sec=d.getSeconds()+d.getMilliseconds()/1000, min=d.getMinutes()+sec/60, hr=d.getHours()%12+min/60;
    h.setAttribute('transform','rotate('+(hr*30)+' 50 50)'); $('#ck-m').setAttribute('transform','rotate('+(min*6)+' 50 50)'); $('#ck-s').setAttribute('transform','rotate('+(sec*6)+' 50 50)');
    $('#ck-t').textContent=d.toLocaleTimeString(); $('#ck-dt').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
  };
  clearInterval(s._iv); upd(); s._iv=setInterval(upd,500);
}
const fmtSw=ms=>{const t=Math.floor(ms/10),cs=t%100,sec=Math.floor(t/100)%60,m=Math.floor(t/6000);return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'.'+String(cs).padStart(2,'0')};
function renderStopwatch(s,vp){
  vp.innerHTML='<div class="sw"><div class="sw-t" id="sw-t"></div><div class="sw-h">Center: start / stop · Hold: reset · ⏭: lap</div><div class="sw-l" id="sw-l"></div></div>';
  const upd=()=>{
    if(scr()!==s){clearInterval(s._iv);return}
    const el=$('#sw-t'); if(!el) return;
    el.textContent=fmtSw(s.run?(s.t+Date.now()-s.t0):s.t);
    const l=$('#sw-l'); if(l){const n=s.laps.length,from=Math.max(0,n-4);l.innerHTML=s.laps.slice(from).map((x,i)=>'<div>Lap '+(from+i+1)+' &nbsp; '+fmtSw(x)+'</div>').join('')}
  };
  clearInterval(s._iv); upd(); s._iv=setInterval(upd,50);
}
function swToggle(s){if(s.run){s.t+=Date.now()-s.t0;s.run=false}else{s.t0=Date.now();s.run=true}tick()}
function swLap(s){const ms=s.run?(s.t+Date.now()-s.t0):s.t;if(ms>0)s.laps.push(ms);tick()}
function swReset(s){s.t=0;s.run=false;s.laps=[];toast('Stopwatch reset')}
function renderCalendar(s,vp){
  const now=new Date(), d=new Date(now.getFullYear(),now.getMonth()+s.m,1);
  const first=d.getDay(), days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  let cells=''; ['S','M','T','W','T','F','S'].forEach(x=>cells+='<div class="cal-h">'+x+'</div>');
  for(let i=0;i<first;i++) cells+='<div></div>';
  for(let i=1;i<=days;i++) cells+='<div class="cal-d'+((s.m===0&&i===now.getDate())?' today':'')+'">'+i+'</div>';
  vp.innerHTML='<div class="cal"><div class="cal-t">'+esc(d.toLocaleDateString([],{month:'long',year:'numeric'}))+'</div><div class="cal-g">'+cells+'</div></div>';
}
/* Brick — breakout, played with the wheel */
function brickInit(s,w,h){
  const cols=8, rows=5, bw=(w-8)/cols, colors=['#ff4d4d','#ff9f40','#ffd93d','#4dde7a','#4d9fff'];
  s.g={w,h,pad:{x:w/2,w:Math.max(36,w*.2),h:6,y:h-14},ball:{x:w/2,y:h-21,vx:0,vy:0,r:3.5},bricks:[],score:0,lives:3,lvl:1,run:false,over:false,hi:parseInt(lsGet('ipod_brick_hi'))||0};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++) s.g.bricks.push({x:4+c*bw,y:24+r*10,w:bw-2,h:8,c:colors[r],a:true});
}
function brickServe(s){const g=s.g;g.ball.x=g.pad.x;g.ball.y=g.pad.y-g.ball.r-1;g.ball.vx=0;g.ball.vy=0}
function renderBrick(s,vp){
  vp.innerHTML='<canvas id="bk" style="position:absolute;inset:0;width:100%;height:100%;background:#0b0d12"></canvas>';
  const cv=$('#bk'), r=vp.getBoundingClientRect(), w=Math.max(200,Math.floor(r.width||315)), h=Math.max(150,Math.floor(r.height||215));
  cv.width=w; cv.height=h;
  const ctx=cv.getContext&&cv.getContext('2d');
  if(!ctx){vp.innerHTML='<div class="txt">Brick needs canvas support.</div>';return}
  brickInit(s,w,h); brickServe(s); s.ctx=ctx; cancelAnimationFrame(s._raf);
  let last=performance.now();
  const loop=t=>{if(scr()!==s||!$('#bk'))return;const dt=Math.min(2,(t-last)/16.67);last=t;brickStep(s,dt);brickDraw(s);s._raf=requestAnimationFrame(loop)};
  s._raf=requestAnimationFrame(loop);
  s.onLeave=()=>cancelAnimationFrame(s._raf);
}
function brickStep(s,dt){
  const g=s.g; if(!g.run||g.over) return; const b=g.ball, p=g.pad;
  b.x+=b.vx*dt; b.y+=b.vy*dt;
  if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)} if(b.x>g.w-b.r){b.x=g.w-b.r;b.vx=-Math.abs(b.vx)}
  if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}
  if(b.vy>0&&b.y+b.r>=p.y&&b.y-b.r<=p.y+p.h&&b.x>=p.x-p.w/2-2&&b.x<=p.x+p.w/2+2){
    const hit=clamp((b.x-p.x)/(p.w/2),-1,1), sp=Math.hypot(b.vx,b.vy), ang=hit*1.0;
    b.vx=sp*Math.sin(ang); b.vy=-Math.abs(sp*Math.cos(ang)); b.y=p.y-b.r;
  }
  for(const k of g.bricks){
    if(!k.a) continue;
    if(b.x+b.r>k.x&&b.x-b.r<k.x+k.w&&b.y+b.r>k.y&&b.y-b.r<k.y+k.h){
      k.a=false; g.score+=10*g.lvl;
      const ox=Math.min(b.x+b.r-k.x,k.x+k.w-(b.x-b.r)), oy=Math.min(b.y+b.r-k.y,k.y+k.h-(b.y-b.r));
      if(ox<oy) b.vx=-b.vx; else b.vy=-b.vy;
      tick(); break;
    }
  }
  if(b.y>g.h+6){
    g.lives--; g.run=false;
    if(g.lives<=0){g.over=true;if(g.score>g.hi){g.hi=g.score;try{localStorage.setItem('ipod_brick_hi',g.hi)}catch{}}}
    else brickServe(s);
  }
  if(g.bricks.every(k=>!k.a)){
    const keep={score:g.score,lives:g.lives,lvl:g.lvl+1,hi:g.hi};
    brickInit(s,g.w,g.h); Object.assign(s.g,keep); brickServe(s);
  }
}
function brickToggle(s){
  const g=s.g; if(!g) return;
  if(g.over){brickInit(s,g.w,g.h);brickServe(s);tick();return}
  if(!g.run){const sp=2.3+g.lvl*.3;g.ball.vx=sp*.5*(Math.random()<.5?-1:1);g.ball.vy=-sp;g.run=true}else g.run=false;
  tick();
}
function brickMove(s,d){const g=s.g;if(!g)return;g.pad.x=clamp(g.pad.x+d*16,g.pad.w/2,g.w-g.pad.w/2);if(!g.run&&!g.over)g.ball.x=g.pad.x}
function brickDraw(s){
  const g=s.g, c=s.ctx; c.clearRect(0,0,g.w,g.h);
  g.bricks.forEach(k=>{if(k.a){c.fillStyle=k.c;c.fillRect(k.x,k.y,k.w,k.h)}});
  c.fillStyle='#e8eef9'; c.fillRect(g.pad.x-g.pad.w/2,g.pad.y,g.pad.w,g.pad.h);
  c.fillStyle='#fff'; c.beginPath(); c.arc(g.ball.x,g.ball.y,g.ball.r,0,Math.PI*2); c.fill();
  c.fillStyle='#9fb0c9'; c.font='11px sans-serif'; c.textAlign='left'; c.fillText('Score '+g.score+'   Lv '+g.lvl,6,13);
  c.textAlign='right'; c.fillText('♥'.repeat(Math.max(0,g.lives)),g.w-6,13);
  c.textAlign='center'; c.fillStyle='#fff';
  if(g.over) c.fillText('Game over — click to restart   Best '+g.hi,g.w/2,g.h/2+30);
  else if(!g.run) c.fillText('Click to launch · turn wheel to move',g.w/2,g.h/2+30);
}
/* Music Quiz — name the artist; songs come from your library */
function startQuiz(){
  const lib=libSongs().filter(t=>t.artistId), artists=[...new Set(lib.map(t=>t.artist))];
  if(lib.length<4||artists.length<4){toast('Need 4+ songs by 4+ artists in your library');return}
  const qs=listScreen('Quiz',()=>qs.opts||[]); qs.total=10; qs.round=0; qs.score=0;
  qs.onLeave=()=>{quizMode=false;try{if(ytPlayer)ytPlayer.pauseVideo()}catch{}};
  quizMode=true; push(qs); quizNext(qs,lib,artists);
}
function quizNext(qs,lib,artists){
  if(qs.round>=qs.total){
    quizMode=false; try{if(ytPlayer)ytPlayer.pauseVideo()}catch{}
    const i=stack.indexOf(qs);
    if(i>=0){stack[i]=textScreen('Quiz Over','You scored '+qs.score+' / '+qs.total+'\n\n'+(qs.score>=8?'🎧 Music genius!':qs.score>=5?'Nice ear!':'Keep listening!')+'\n\nPress MENU to exit.');if(scr()===stack[i])render()}
    return;
  }
  qs.round++;
  const t=lib[Math.floor(Math.random()*lib.length)];
  const names=shuffleArr([t.artist,...shuffleArr(artists.filter(a=>a!==t.artist)).slice(0,3)]);
  qs.title='Quiz '+qs.round+'/'+qs.total+' · '+qs.score+' pts'; qs.locked=false; qs.sel=0;
  qs.opts=names.map(n=>({label:n,onSelect:()=>{
    if(qs.locked) return; qs.locked=true;
    const ok=n===t.artist; if(ok) qs.score++;
    toast(ok?'✓ Correct!':'✗ It was '+t.artist+' — '+t.title);
    setTimeout(()=>{if(scr()===qs)quizNext(qs,lib,artists)},1800);
  }}));
  queue=[{...t}]; failCount=0; playTrack(0);
  if(scr()===qs) render();
}

try{if(navigator.getBattery)navigator.getBattery().then(b=>{const set=()=>{$('#sb-batt i').style.width=Math.max(8,b.level*100)+'%'};set();b.addEventListener('levelchange',set)})}catch{}
